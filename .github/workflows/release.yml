name: Smart Vibe Kit release gate

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s skill/tests -v
      - run: python -B -m unittest discover -s installer/tests -v
      - run: python -B -m unittest discover -s examples/pocket-list/tests -v
      - run: python -B skill/runtime/svk.py check --package --root skill
      - run: python -B scripts/release_check.py
      - run: python -B scripts/verify_archive.py

  release-ready:
    name: Release-ready gate
    needs: verify-tag
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a red verification matrix
        run: test "${{ needs.verify-tag.result }}" = "success"
